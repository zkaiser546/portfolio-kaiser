services:
  - type: web
    name: portfolio-kaiser
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        fromService:
          type: web
          name: portfolio-kaiser
          property: url
      - key: APP_KEY
        generateValue: true
      - key: SESSION_DRIVER
        value: array
      - key: CACHE_STORE
        value: array
      - key: LOG_CHANNEL
        value: stderr
